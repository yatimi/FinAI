name: iOS CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      simulator_boot:
        description: Simulator preparation for a full CI comparison
        type: choice
        options: [early, late]
        default: early

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Choose an available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > /tmp/finai-devices.json
          python3 - <<'PYTHON'
          import json, os
          with open('/tmp/finai-devices.json') as source:
              runtimes = json.load(source)['devices']
          devices = [device for runtime, values in sorted(runtimes.items(), reverse=True)
                     if any(version in runtime for version in ('iOS-26', 'iOS-27')) for device in values
                     if device['name'].startswith('iPhone') and device.get('isAvailable')]
          if not devices:
              raise SystemExit('No available iOS 26 or 27 iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PYTHON
      - name: Cache package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/FinAI-SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('FinAI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build and test
        env:
          SIMULATOR_BOOT_MODE: ${{ inputs.simulator_boot || 'early' }}
        run: |
          set -o pipefail
          started=$(date +%s)
          sysctl hw.ncpu hw.memsize > "$RUNNER_TEMP/FinAI-Runner.log"
          xcodebuild -version >> "$RUNNER_TEMP/FinAI-Runner.log"
          echo "$SIMULATOR_BOOT_MODE" > "$RUNNER_TEMP/FinAI-BootMode.txt"
          python3 Scripts/sample-ci-runner.py "$RUNNER_TEMP" &
          sample_pid=$!
          boot_pid=""
          cleanup() {
            kill "$sample_pid" 2>/dev/null || true
            if [[ -n "$boot_pid" ]]; then kill "$boot_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          common_args=(
            -project FinAI.xcodeproj
            -scheme FinAI
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
            -derivedDataPath "$RUNNER_TEMP/FinAI-DerivedData"
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/FinAI-SourcePackages"
            -onlyUsePackageVersionsFromResolvedFile
            CODE_SIGNING_ALLOWED=NO
          )
          if [[ "$SIMULATOR_BOOT_MODE" == early ]]; then
            xcrun simctl bootstatus "$SIMULATOR_ID" -b > "$RUNNER_TEMP/FinAI-Simulator.log" 2>&1 &
            boot_pid=$!
          fi
          echo build > "$RUNNER_TEMP/FinAI-Phase.txt"
          xcodebuild build-for-testing "${common_args[@]}" \
            -showBuildTimingSummary \
            -skipMacroValidation 2>&1 | tee "$RUNNER_TEMP/FinAI-Build.log"
          echo "Build for testing: $(( $(date +%s) - started )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          echo simulator-ready > "$RUNNER_TEMP/FinAI-Phase.txt"
          if [[ "$SIMULATOR_BOOT_MODE" == late ]]; then
            xcrun simctl bootstatus "$SIMULATOR_ID" -b > "$RUNNER_TEMP/FinAI-Simulator.log" 2>&1 &
            boot_pid=$!
          fi
          wait "$boot_pid"
          boot_pid=""
          echo "Build and simulator ready: $(( $(date +%s) - started )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          test_started=$(date +%s)
          echo test > "$RUNNER_TEMP/FinAI-Phase.txt"
          xcodebuild test-without-building "${common_args[@]}" \
            -resultBundlePath "$RUNNER_TEMP/FinAI-Tests.xcresult" \
            -collect-test-diagnostics never \
            -skipMacroValidation 2>&1 | tee "$RUNNER_TEMP/FinAI-Test.log"
          echo "Test execution and finalization: $(( $(date +%s) - test_started )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          echo complete > "$RUNNER_TEMP/FinAI-Phase.txt"
          echo "Build and test total: $(( $(date +%s) - started )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FinAI-Tests
          path: |
            ${{ runner.temp }}/FinAI-Tests.xcresult
            ${{ runner.temp }}/FinAI-Test.log
            ${{ runner.temp }}/FinAI-Build.log
            ${{ runner.temp }}/FinAI-Simulator.log
            ${{ runner.temp }}/FinAI-Runner.log
            ${{ runner.temp }}/FinAI-RunnerSamples.jsonl
            ${{ runner.temp }}/FinAI-BootMode.txt
          if-no-files-found: ignore
